name: Release (on tag)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x ./gradlew

      - name: Build release package
        shell: bash
        run: ./gradlew --no-daemon --stacktrace release

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCH="$(uname -m)"
          ICON="src/boardcad/icons/BC 32x32.png"
          BUILD_DIR=build/appimage
          VERSION="$(./gradlew -q --no-daemon properties --property version | awk '/^version:/{print $2}')"
          [ -n "$VERSION" ] || { echo "version not found in build.gradle"; exit 1; }

          mkdir -p "$BUILD_DIR" release

          MAIN_JAR="$(basename build/libs/*.jar)"
          jpackage \
            --type app-image \
            --name BoardCAD \
            --input build/release/input \
            --main-jar "$MAIN_JAR" \
            --main-class boardcad.gui.jdk.BoardCAD \
            --runtime-image build/runtime-image \
            --icon "$ICON" \
            --dest "$BUILD_DIR/jpackage" \
            --java-options --enable-native-access=ALL-UNNAMED \
            --java-options --add-exports=java.base/java.lang=ALL-UNNAMED \
            --java-options --add-exports=java.desktop/sun.awt=ALL-UNNAMED \
            --java-options --add-exports=java.desktop/sun.java2d=ALL-UNNAMED

          APPDIR="$BUILD_DIR/AppDir"
          mkdir -p "$APPDIR/usr"
          cp -a "$BUILD_DIR/jpackage/BoardCAD/." "$APPDIR/usr/"
          cp "$ICON" "$APPDIR/boardcad.png"

          cat > "$APPDIR/boardcad.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=BoardCAD
          Comment=Surfboard design CAD/CAM
          Exec=BoardCAD
          Icon=boardcad
          Categories=Graphics;Engineering;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/BoardCAD" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o "$BUILD_DIR/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x "$BUILD_DIR/appimagetool"
          ARCH="$ARCH" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$BUILD_DIR/appimagetool" "$APPDIR" "release/BoardCAD-${VERSION}-${ARCH}.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boardcad-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BoardCAD LE ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**
